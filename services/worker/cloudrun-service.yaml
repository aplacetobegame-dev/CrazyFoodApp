# Checked in for a later deploy. Do not apply this file in the local foundation pass.
# Replace REGION, PROJECT, and the image tag before use. DATABASE_URL must come from Secret Manager.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: food-felonies-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/food-felonies/worker:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WORKER_VISIBILITY_TIMEOUT_SECONDS
              value: "30"
            - name: WORKER_MAX_ATTEMPTS
              value: "5"
            - name: WORKER_POLL_INTERVAL_MS
              value: "1000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: food-felonies-database-url
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
